<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://mwask-anicove.hf.space/">
    <link rel="canonical" href="https://mwask-anicove.hf.space/">
    <title>Redirecting to Anicove...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Redirecting...</h1>
        <p>Taking you to <strong>AniCove</strong></p>
        <div class="spinner"></div>
        <p>If you are not redirected automatically, <a href="https://mwask-anicove.hf.space/">click here</a>.</p>
    </div>
    
    <script>
        // Immediate redirect using multiple methods for better compatibility
        (function() {
            var targetUrl = 'https://mwask-anicove.hf.space/';
            
            // Method 1: Replace current history entry (prevents back button issues)
            if (window.location.replace) {
                window.location.replace(targetUrl);
            } else {
                // Method 2: Standard redirect
                window.location.href = targetUrl;
            }
        })();
    </script>
</body>
</html>
